<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administradores | Canal Anônimo SOS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">

</head>

<body>

<div class="pagina">

<header class="header">

    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Lobios" class="logo-header">

    <div>

        <a href="{{ url_for('pages.dashboard') }}" class="btn secundario">

            Dashboard

        </a>

        <button class="btn principal" onclick="logout()">

            Sair

        </button>

    </div>

</header>

<div class="container">

<div class="topo">

<h1>Administradores</h1>

<p>

Gerencie os administradores do Canal Anônimo SOS.

</p>

</div>

<div class="conteudo">

<h2>Cadastrar Administrador</h2>

<div class="campo">

<label>Nome</label>

<input
type="text"
id="nome"
placeholder="Nome do administrador">

</div>

<div class="campo">

<label>E-mail</label>

<input
type="email"
id="email"
placeholder="email@empresa.com">

</div>

<div class="campo">

    <label>Senha</label>

    <input
        type="password"
        id="senha"
        placeholder="Senha">

    <small class="senha-info">
        A senha deve conter no mínimo 8 caracteres, incluindo uma letra maiúscula,
        uma letra minúscula, um número e um caractere especial.
    </small>

</div>

<div class="botoes">

<button
class="btn principal"
onclick="cadastrarAdmin()">

Cadastrar Administrador

</button>

</div>

<hr>

<h2>Usuários cadastrados</h2>

<table>

<thead>

<tr>

<th>ID</th>

<th>Nome</th>

<th>E-mail</th>

<th>Tipo</th>

<th>Ações</th>

</tr>

</thead>

<tbody id="tabelaAdmins">

</tbody>

</table>

</div>

</div>

</div>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>

</body>

</html>
